<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iGEM Education — Initiatives</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<style>
  :root{
    /* NYUAD iGEM · DuneLock theme */
    --bg:#0b1725; --panel:#122238; --panel-2:#172a43; --ink:#f7edd8; --muted:#b3a68d;
    --line:rgba(247,237,216,.14);
    --land-stroke:#e6dabf;              /* light outlines on dark, blends with panel */
    --frame:#99451a; --frame-dark:#3d0a0a; --frame-deep:#1b0b11;
    --global:#ffc235; --head:#eaf1ec;
    --font-display:"Caprasimo","Cooper Black","Arial Black",sans-serif;
    --font-body:"Lexend",system-ui,sans-serif;
    --anim:.72s;
  }
  body.light{
    --bg:#f4e8ce; --panel:#fffaf0; --panel-2:#f6ecd6; --ink:#4a0d0d; --muted:#8a7256;
    --line:rgba(96,0,0,.16); --land-stroke:#5a2018; --head:#5a0d0d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:var(--font-body);background:var(--bg);color:var(--ink);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:26px;
  }
  .app{
    width:100%;max-width:1240px;display:grid;
    grid-template-columns:440px 1fr;gap:18px;
    grid-template-areas:"map content" "shelf content";
  }
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.25);}
  .panel-label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}

  /* ---- Map: light outlines on the dark panel until a country is coloured ---- */
  #map{grid-area:map;padding:14px 16px;display:flex;flex-direction:column;height:250px}
  #map svg{width:100%;height:100%;flex:1;display:block}
  .country{fill:transparent;stroke:var(--land-stroke);stroke-width:.5px;
    transition:fill .5s ease, transform .5s cubic-bezier(.2,.8,.2,1), filter .5s ease;
    transform-box:fill-box;transform-origin:center;}
  .country.active{filter:drop-shadow(0 3px 7px rgba(0,0,0,.5));transform:scale(1.09) translateY(-1px);}

  /* ---- Bookcase ---- */
  #shelf{grid-area:shelf}
  .bookcase{background:linear-gradient(var(--frame),var(--frame-dark));
    border-radius:74px 74px 14px 14px;padding:12px;
    box-shadow:0 24px 46px rgba(0,0,0,.5), inset 0 0 0 3px rgba(0,0,0,.28);}
  .bookcase-inner{background:var(--frame-deep);border-radius:64px 64px 8px 8px;
    padding:30px 12px 12px;display:flex;flex-direction:column;cursor:default;}
  .shelf-row{display:flex;flex-direction:column}
  .books{display:flex;align-items:flex-end;justify-content:center;gap:4px;min-height:150px;padding:0 4px}
  .ledge{height:12px;background:linear-gradient(#5c3a1f,#331d0d);border-radius:2px;
    box-shadow:0 7px 12px rgba(0,0,0,.55), inset 0 2px 2px rgba(255,255,255,.1);margin:0 2px 16px}
  .shelf-row:last-child .ledge{margin-bottom:2px}
  .book{position:relative;width:25px;flex:none;cursor:pointer;
    transform-origin:bottom center;
    transition:transform .42s cubic-bezier(.2,.8,.2,1);}
  .book:hover{transform:translateY(-10px)}
  .book .cover{position:absolute;inset:0;background:var(--bar);border-radius:2px 4px 4px 2px;
    box-shadow:inset -6px 0 8px rgba(0,0,0,.32), inset 3px 0 3px rgba(255,255,255,.25);
    display:flex;align-items:center;justify-content:center;padding:7px 0;}
  .book .title{writing-mode:vertical-rl;transform:rotate(180deg);color:var(--ink-on);
    font-size:8.5px;font-weight:600;letter-spacing:.01em;text-align:center;line-height:1.03;
    max-height:100%;overflow:hidden;}
  .book.out{visibility:hidden}

  /* ---- Flying / opening book ---- */
  .flyer{position:fixed;z-index:1000;perspective:1300px;
    transition:transform var(--anim) cubic-bezier(.3,.72,.2,1);will-change:transform;pointer-events:none;}
  .flyer .fb-back{position:absolute;inset:-4px;background:var(--bar);border-radius:4px 9px 9px 4px;
    box-shadow:0 16px 34px rgba(0,0,0,.45);}
  .flyer .fb-page{position:absolute;inset:0;background:#fff6e2;border-radius:2px 6px 6px 2px;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;padding:16px;text-align:center;}
  .flyer .fb-page em{display:block;font-style:normal;font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:#99451a;font-weight:700;margin-bottom:6px;opacity:0;transition:opacity .35s ease .3s}
  .flyer .fb-page strong{display:block;font-family:var(--font-display);font-weight:400;font-size:16px;line-height:1.15;color:#4a0d0d;opacity:0;transition:opacity .35s ease .35s}
  .flyer:not(.closed) .fb-page em,.flyer:not(.closed) .fb-page strong{opacity:1}
  .flyer .fb-cover{position:absolute;inset:0;background:var(--bar);border-radius:3px 7px 7px 3px;
    transform-origin:left center;transition:transform var(--anim) cubic-bezier(.4,.1,.2,1);
    backface-visibility:hidden;box-shadow:inset -9px 0 12px rgba(0,0,0,.34), inset 4px 0 5px rgba(255,255,255,.25);
    display:flex;align-items:center;justify-content:center;}
  .flyer .fb-cover .sp{writing-mode:vertical-rl;transform:rotate(180deg);color:var(--ink-on);font-size:10px;font-weight:600}
  .flyer.closed .fb-cover{transform:rotateY(0)}
  .flyer:not(.closed) .fb-cover{transform:rotateY(-158deg)}

  /* ---- Content ---- */
  #content{grid-area:content;padding:22px 42px 34px;overflow-y:auto}
  #stage{height:176px;margin:0 0 6px;position:relative}
  .eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--bar,var(--muted));font-weight:700;margin:0 0 6px}
  #content h1{font-family:var(--font-display);font-weight:400;font-size:32px;margin:0 0 8px;line-height:1.08;color:var(--head)}
  /* theme toggle */
  #themeToggle{position:fixed;top:18px;right:18px;z-index:2000;display:inline-flex;align-items:center;gap:7px;
    font-family:var(--font-body);font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--ink);
    background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:8px 13px;cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,.25);transition:transform .15s ease, background .3s ease, color .3s ease;}
  #themeToggle:hover{transform:translateY(-1px)}
  #themeToggle .ic{width:14px;height:14px;display:inline-block}
  .type-meta{color:var(--muted);font-size:13.5px;margin:0 0 18px}
  .impact{display:flex;align-items:center;gap:14px;background:var(--panel-2);border:1px solid var(--line);
    border-left:5px solid var(--bar,#ccc);border-radius:12px;padding:14px 18px;margin:0 0 22px;max-width:640px}
  .impact .imp-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .impact .imp-num{font-size:16px;font-weight:600;color:var(--ink)}
  .impact .imp-num.soft{font-weight:400;color:var(--muted);font-style:italic}
  .section-h{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:22px 0 8px}
  .obj{max-width:640px;padding-left:20px;margin:0;color:#e9dcc2;font-size:15px;line-height:1.6}
  .obj li{margin:0 0 5px}
  .regions{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px;max-width:640px}
  .chip{font-size:12px;padding:5px 11px;border-radius:20px;font-weight:600}
  .fade{animation:fade .5s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .empty{color:var(--muted);font-size:15.5px;max-width:640px;line-height:1.6}
  @media(max-width:880px){.app{grid-template-columns:1fr;grid-template-areas:"map" "shelf" "content";}}
</style>
</head>
<body>
<button id="themeToggle" aria-label="Toggle light or dark theme"></button>
<div class="app">
  <section class="panel" id="map">
    <p class="panel-label">Impact Map</p>
    <svg viewBox="0 0 960 500" preserveAspectRatio="xMidYMid meet" aria-label="World map"></svg>
  </section>

  <section id="shelf">
    <div class="bookcase"><div class="bookcase-inner" id="bookcaseInner">
      <div id="shelves"></div>
    </div></div>
  </section>

  <section class="panel" id="content">
    <div id="stage"></div>
    <div id="contentInner">
      <p class="eyebrow">Getting started</p>
      <h1>Open an initiative</h1>
      <p class="empty">Pull a book off the shelf — it opens here and the map lights up where the initiative reached. Click an empty spot on the shelf to reshelve and see the global impact.</p>
    </div>
  </section>
</div>

<script src="initiatives-data.js"></script>
<script>
const SHOW_IMPACT = true;

// spines use the DuneLock accent palette (decorative — everything is done)
const PALETTE=WIKI_DATA.palette;
function textOn(hex){
  const c=hex.replace('#','');
  const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
  return (0.299*r+0.587*g+0.114*b)/255>0.6 ? '#3a1608' : '#fff6e2';
}

const initiatives=WIKI_DATA.initiatives;
initiatives.forEach((it,i)=>{it.id="b"+i;it.color=PALETTE[i%PALETTE.length];it.ink=textOn(it.color);});

// ---- Build shelves: top-heavy 9 / 9 / 5 ----
const shelfLayout=WIKI_DATA.shelfLayout;
const heights=WIKI_DATA.bookHeights;
const shelvesEl=document.getElementById("shelves");
const bookById={};
let idx=0;
shelfLayout.forEach(count=>{
  const row=document.createElement("div");row.className="shelf-row";
  const books=document.createElement("div");books.className="books";
  for(let k=0;k<count && idx<initiatives.length;k++,idx++){
    const init=initiatives[idx];
    const b=document.createElement("div");
    b.className="book";b.dataset.id=init.id;
    b.style.setProperty("--bar",init.color);
    b.style.setProperty("--ink-on",init.ink);
    b.style.height=heights[k%heights.length]+"px";
    b.innerHTML=`<div class="cover"><div class="title">${init.short}</div></div>`;
    b.addEventListener("click",e=>{e.stopPropagation();select(init.id);});
    books.appendChild(b);
    bookById[init.id]=b;
  }
  const ledge=document.createElement("div");ledge.className="ledge";
  row.appendChild(books);row.appendChild(ledge);
  shelvesEl.appendChild(row);
});

// ---- Content ----
const inner=document.getElementById("contentInner");
const stage=document.getElementById("stage");
function impactBlock(num,soft){
  if(!SHOW_IMPACT) return "";
  return `<div class="impact"><span class="imp-label">Impact</span>
      <span class="imp-num${soft?" soft":""}">${num}</span></div>`;
}
function renderContent(init){
  const ink=init.ink;
  const chips=init.countries.map(c=>`<span class="chip" style="background:${init.color};color:${ink}">${c}</span>`).join("");
  const objs=init.obj.map(o=>`<li>${o}</li>`).join("");
  let num=init.numbers,soft=false; if(!num){soft=true;num="Impact not yet recorded";}
  inner.style.setProperty("--bar",init.color);
  inner.innerHTML=`<div class="fade">
      <p class="eyebrow">${init.type}</p>
      <h1>${init.title}</h1>
      <p class="type-meta">${init.audience}</p>
      ${impactBlock(num,soft)}
      <div class="section-h">Objectives</div>
      <ul class="obj">${objs}</ul>
      <div class="section-h">Where it reached</div>
      <div class="regions">${chips}</div>
    </div>`;
}
function renderGlobal(){
  const set=new Set(); initiatives.forEach(i=>i.countries.forEach(c=>set.add(c)));
  const G=WIKI_DATA.global||{};
  const sub=s=>String(s||"").replace(/{countries}/g,set.size).replace(/{count}/g,initiatives.length);
  const gink=textOn("#ffc235");
  const chips=[...set].map(c=>`<span class="chip" style="background:var(--global);color:${gink}">${c}</span>`).join("");
  const highs=(G.highlights||[]).map(x=>`<li>${sub(x)}</li>`).join("");
  inner.style.setProperty("--bar","var(--global)");
  inner.innerHTML=`<div class="fade">
      <p class="eyebrow">${G.eyebrow||"All initiatives"}</p>
      <h1>${G.title||"Global Impact"}</h1>
      <p class="type-meta">${G.meta||""}</p>
      ${impactBlock(sub(G.impact),false)}
      <div class="section-h">Highlights</div>
      <ul class="obj">${highs}</ul>
      <div class="section-h">Everywhere we reached</div>
      <div class="regions">${chips}</div>
    </div>`;
}

// ---- Map ----
const svg=d3.select("#map svg");
const g=svg.append("g");
const projection=d3.geoNaturalEarth1().scale(178).translate([480,250]);
const path=d3.geoPath(projection);
let byName={};
d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(topo=>{
  const c=topojson.feature(topo,topo.objects.countries).features;
  g.selectAll("path").data(c).enter().append("path")
    .attr("class","country").attr("d",path)
    .each(function(d){byName[d.properties.name]=this;});
}).catch(()=>{document.querySelector("#map .panel-label").textContent="Impact Map (offline — map failed to load)";});
function clearMap(){document.querySelectorAll(".country.active").forEach(el=>{el.classList.remove("active");el.style.fill="";});}
function paintMap(countries,color){
  clearMap();
  countries.forEach(name=>{const el=byName[name];if(el){el.classList.add("active");el.style.fill=color;el.parentNode.appendChild(el);}});
}

// ---- Shelf tilt: always recomputed from where the gap(s) currently are ----
function relayout(shelf){
  const kids=[...shelf.children];
  const gaps=[]; kids.forEach((k,i)=>{if(k.classList.contains("out"))gaps.push(i);});
  const mag=[0,6,3.5,2,1.2,0.7,0.4];
  kids.forEach((k,i)=>{
    if(k.classList.contains("out")){k.style.transform="";return;}
    if(!gaps.length){k.style.transform="";return;}
    const g=gaps.reduce((a,b)=>Math.abs(b-i)<Math.abs(a-i)?b:a);
    const d=Math.abs(g-i);
    if(d===0){k.style.transform="";return;}
    const dir=g>i?1:-1, a=mag[Math.min(d,mag.length-1)]||0.3;
    k.style.transform=`rotate(${dir*a}deg)`;
  });
}
function raiseNeighbors(bookEl){ // lift the immediate neighbours to make room as a book returns
  const kids=[...bookEl.parentNode.children], i=kids.indexOf(bookEl);
  [kids[i-1],kids[i+1]].forEach(k=>{ if(k && !k.classList.contains("out")){
    k.style.transform=(k.style.transform||"")+" translateY(-9px)"; }});
}

// ---- Flyer (pull-out + open at content) ----
const OPEN_W=232, OPEN_H=150, DUR=760;
function stageBox(){
  const r=stage.getBoundingClientRect();
  return {left:r.left+(r.width-OPEN_W)/2, top:r.top+14, w:OPEN_W, h:OPEN_H};
}
function slotTransform(slot, box){
  const sx=slot.width/box.w, sy=slot.height/box.h;
  const dx=(slot.left+slot.width/2)-(box.left+box.w/2);
  const dy=(slot.top+slot.height/2)-(box.top+box.h/2);
  return `translate(${dx}px,${dy}px) scale(${sx.toFixed(4)},${sy.toFixed(4)})`;
}
function makeFlyer(init,box){
  const f=document.createElement("div");
  f.className="flyer closed";
  f.style.left=box.left+"px";f.style.top=box.top+"px";
  f.style.width=box.w+"px";f.style.height=box.h+"px";
  f.style.setProperty("--bar",init.color);
  f.style.setProperty("--ink-on",init.ink);
  f.innerHTML=`<div class="fb-back"></div>
               <div class="fb-page"><div><em>${init.type}</em><strong>${init.title}</strong></div></div>
               <div class="fb-cover"><span class="sp">${init.short}</span></div>`;
  document.body.appendChild(f);
  return f;
}

let current=null; // {id, flyer, bookEl}

function bringOut(init){
  const bookEl=bookById[init.id];
  const slot=bookEl.getBoundingClientRect();
  const box=stageBox();
  const f=makeFlyer(init,box);
  f.style.transform=slotTransform(slot,box);      // start: nested in its shelf slot, closed
  bookEl.classList.add("out");
  relayout(bookEl.parentNode);                    // neighbours tilt into the gap
  f.getBoundingClientRect();                        // reflow
  requestAnimationFrame(()=>{ f.style.transform=""; f.classList.remove("closed"); }); // fly out + open
  current={id:init.id,flyer:f,bookEl};
  setTimeout(()=>renderContent(init),300);
}
function putBack(state,then){
  if(!state){ if(then) then(); return; }
  const {flyer,bookEl}=state;
  const box={left:parseFloat(flyer.style.left),top:parseFloat(flyer.style.top),w:OPEN_W,h:OPEN_H};
  const slot=bookEl.getBoundingClientRect();
  raiseNeighbors(bookEl);                          // neighbours lift to make room
  flyer.classList.add("closed");
  flyer.style.transform=slotTransform(slot,box);   // fly back + close
  setTimeout(()=>{
    flyer.remove();
    bookEl.classList.remove("out");
    relayout(bookEl.parentNode);                   // gap closes, shelf settles
    if(then) then();
  },DUR);
}

function select(id){
  if(current && current.id===id) return;
  const init=initiatives.find(i=>i.id===id);
  const old=current;
  bringOut(init);              // new book comes out and opens (sets current)
  paintMap(init.countries,init.color);
  putBack(old);               // old book returns to the shelf — simultaneously
}

function showGlobal(){
  const old=current; current=null;
  putBack(old);
  paintMap([...new Set(initiatives.flatMap(i=>i.countries))],
           getComputedStyle(document.documentElement).getPropertyValue("--global").trim());
  renderGlobal();
}

// click an empty area of the shelf -> reshelve + show global impact
document.getElementById("bookcaseInner").addEventListener("click",showGlobal);

// keep the open book aligned on resize
window.addEventListener("resize",()=>{
  if(!current) return;
  const box=stageBox();
  current.flyer.style.left=box.left+"px";
  current.flyer.style.top=box.top+"px";
});

// ---- Light / dark toggle ----
const tbtn=document.getElementById("themeToggle");
const SUN=`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>`;
const MOON=`<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`;
function applyTheme(mode){
  document.body.classList.toggle("light",mode==="light");
  tbtn.innerHTML=(mode==="light"?MOON:SUN)+`<span>${mode==="light"?"Dark":"Light"}</span>`;
  try{localStorage.setItem("dunelock-theme",mode);}catch(e){}
}
let saved="dark"; try{saved=localStorage.getItem("dunelock-theme")||"dark";}catch(e){}
applyTheme(saved);
tbtn.addEventListener("click",()=>applyTheme(document.body.classList.contains("light")?"dark":"light"));
</script>
</body>
</html>
